name: Build BEATX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract BEATX project
        run: |
          mkdir -p buildsrc
          unzip -o BEATX_Android_v1_GitHub.zip -d buildsrc

      - name: Find project
        run: |
          find buildsrc -name "build.gradle.kts" -o -name "settings.gradle.kts"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: buildsrc/BEATX_Android_v1
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BEATX-APK
          path: buildsrc/BEATX_Android_v1/app/build/outputs/apk/debug/app-debug.apk
